services:
  neo4j:
    image: neo4j:${SCHOLARGRAPH_NEO4J_VERSION:-5.26-community}
    environment:
      NEO4J_AUTH: neo4j/${SCHOLARGRAPH_NEO4J_PASSWORD:-scholargraph-local}
      NEO4J_dbms_default__database: neo4j
    ports:
      - "127.0.0.1:${SCHOLARGRAPH_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${SCHOLARGRAPH_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687 -u neo4j
          -p "$${SCHOLARGRAPH_NEO4J_PASSWORD:-scholargraph-local}"
          "RETURN 1" >/dev/null
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 15s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
